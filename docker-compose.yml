services:
  restaurants-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: restaurants_api

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__RestaurantsDb: "Server=sqlserver,1433;Database=RestaurantsDb;User Id=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"

    ports:
      - "5000:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

    networks:
      - dev-network

    restart: on-failure

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: restaurants_sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    networks:
      - dev-network

    restart: always

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  dev-network:
    driver: bridge

volumes:
  sqlserver-data:
